<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSI Admin | Secure Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container, .dashboard-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .dashboard-container {
            max-width: 1400px;
            width: 95%;
            margin: 20px auto;
        }
        h1 {
            color: #0a2e1f;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #0a2e1f;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #1a4d33;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #0a2e1f;
            color: white;
        }
        .export-btn, .clear-btn {
            margin: 10px 5px;
            padding: 10px 20px;
        }
        .delete-btn {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #e8f5e9;
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #0a2e1f;
        }
        @media (max-width: 768px) {
            th, td {
                font-size: 12px;
                padding: 8px;
            }
            .dashboard-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // PASSWORD: INTERNATIONAL COLLABORATION
        const SECRET_PASSWORD = "INTERNATIONAL COLLABORATION";
        
        function checkAuth() {
            const isAuthenticated = sessionStorage.getItem('tsi_admin_auth');
            if (isAuthenticated === 'true') {
                showDashboard();
            } else {
                showLogin();
            }
        }
        
        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="login-container">
                    <h1>🔐 Admin Access</h1>
                    <p>Enter password to view member records</p>
                    <input type="password" id="passwordInput" placeholder="Enter password" onkeypress="if(event.key==='Enter') login()">
                    <button onclick="login()">Login</button>
                    <div id="errorMsg" class="error"></div>
                </div>
            `;
        }
        
        function login() {
            const password = document.getElementById('passwordInput').value;
            if (password === SECRET_PASSWORD) {
                sessionStorage.setItem('tsi_admin_auth', 'true');
                showDashboard();
            } else {
                document.getElementById('errorMsg').innerText = 'Incorrect password. Access denied.';
            }
        }
        
        function logout() {
            sessionStorage.removeItem('tsi_admin_auth');
            showLogin();
        }
        
        function loadMembers() {
            const members = JSON.parse(localStorage.getItem('tsi_members') || '[]');
            document.getElementById('memberCount').innerText = members.length;
            
            const tbody = document.getElementById('membersBody');
            if (members.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No members registered yet</td></tr>';
                return;
            }
            
            tbody.innerHTML = members.map(m => `
                <tr>
                    <td>${m.id || 'N/A'}</td>
                    <td><strong>${escapeHtml(m.fullName)}</strong></td>
                    <td>${escapeHtml(m.email)}</td>
                    <td>${escapeHtml(m.phone)}</td>
                    <td>${escapeHtml(m.state)}</td>
                    <td>${escapeHtml(m.membershipType)}</td>
                    <td>${new Date(m.timestamp).toLocaleString()}</td>
                    <td><button class="delete-btn" onclick="deleteMember(${m.id})">Delete</button></td>
                </tr>
            `).join('');
        }
        
        function loadDeclarations() {
            const declarations = JSON.parse(localStorage.getItem('tsi_registrations') || '[]');
            document.getElementById('declarationCount').innerText = declarations.length;
            
            const tbody = document.getElementById('declarationsBody');
            if (declarations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">No declarations submitted yet</td></tr>';
                return;
            }
            
            tbody.innerHTML = declarations.map(d => `
                <tr>
                    <td>${d.id || 'N/A'}</td>
                    <td><strong>${escapeHtml(d.fullName)}</strong></td>
                    <td>${escapeHtml(d.tsiId) || 'N/A'}</td>
                    <td>${escapeHtml(d.position)}</td>
                    <td>${escapeHtml(d.state)}</td>
                    <td>${escapeHtml(d.lga) || 'N/A'}</td>
                    <td>${d.date || 'N/A'}</td>
                    <td>${escapeHtml(d.signature) || 'N/A'}</td>
                    <td><button class="delete-btn" onclick="deleteDeclaration(${d.id})">Delete</button></td>
                </tr>
            `).join('');
        }
        
        function deleteMember(id) {
            if (confirm('Delete this member record?')) {
                let members = JSON.parse(localStorage.getItem('tsi_members') || '[]');
                members = members.filter(m => m.id !== id);
                localStorage.setItem('tsi_members', JSON.stringify(members));
                loadMembers();
            }
        }
        
        function deleteDeclaration(id) {
            if (confirm('Delete this declaration?')) {
                let declarations = JSON.parse(localStorage.getItem('tsi_registrations') || '[]');
                declarations = declarations.filter(d => d.id !== id);
                localStorage.setItem('tsi_registrations', JSON.stringify(declarations));
                loadDeclarations();
            }
        }
        
        function clearMembers() {
            if (confirm('⚠️ Delete ALL member records? This cannot be undone.')) {
                localStorage.removeItem('tsi_members');
                loadMembers();
            }
        }
        
        function clearDeclarations() {
            if (confirm('⚠️ Delete ALL declaration records? This cannot be undone.')) {
                localStorage.removeItem('tsi_registrations');
                loadDeclarations();
            }
        }
        
        function exportMembersCSV() {
            const members = JSON.parse(localStorage.getItem('tsi_members') || '[]');
            if (members.length === 0) { alert('No records to export.'); return; }
            const headers = ['ID', 'Full Name', 'Email', 'Phone', 'State', 'Membership Type', 'LGA', 'Registration Date'];
            const rows = members.map(m => [m.id, m.fullName, m.email, m.phone, m.state, m.membershipType, m.lga, m.timestamp]);
            downloadCSV(headers, rows, 'tsi_members');
        }
        
        function exportDeclarationsCSV() {
            const declarations = JSON.parse(localStorage.getItem('tsi_registrations') || '[]');
            if (declarations.length === 0) { alert('No records to export.'); return; }
            const headers = ['ID', 'Full Name', 'TSI ID', 'Position', 'State', 'LGA', 'Date', 'Signature', 'Timestamp'];
            const rows = declarations.map(d => [d.id, d.fullName, d.tsiId, d.position, d.state, d.lga, d.date, d.signature, d.timestamp]);
            downloadCSV(headers, rows, 'tsi_declarations');
        }
        
        function downloadCSV(headers, rows, filename) {
            let csv = headers.join(',') + '\n';
            rows.forEach(row => { csv += row.map(cell => `"${cell}"`).join(',') + '\n'; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function showTab(tab) {
            document.getElementById('members-tab').style.display = tab === 'members' ? 'block' : 'none';
            document.getElementById('declarations-tab').style.display = tab === 'declarations' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (tab === 'members' && i === 0) || (tab === 'declarations' && i === 1));
            });
            if (tab === 'members') loadMembers();
            if (tab === 'declarations') loadDeclarations();
        }
        
        function escapeHtml(text) {
            if (!text) return 'N/A';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function showDashboard() {
            document.getElementById('app').innerHTML = `
                <div class="dashboard-container">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                        <h1>📊 TSI Admin Dashboard</h1>
                        <button onclick="logout()" style="background: #dc3545;">🚪 Logout</button>
                    </div>
                    
                    <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <button class="tab-btn active" onclick="showTab('members')">👥 Members (Join Page)</button>
                        <button class="tab-btn" onclick="showTab('declarations')">📝 Ethics Declarations</button>
                    </div>
                    
                    <div id="members-tab">
                        <div class="stats">
                            <div class="stat-card"><div class="stat-number" id="memberCount">0</div><div>Total Members</div></div>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <button class="export-btn" onclick="exportMembersCSV()">📥 Export Members to CSV</button>
                            <button class="clear-btn" onclick="clearMembers()">🗑️ Clear All Members</button>
                        </div>
                        <div style="overflow-x: auto;">
                            <table><thead><tr><th>ID</th><th>Full Name</th><th>Email</th><th>Phone</th><th>State</th><th>Membership Type</th><th>Registered On</th><th>Action</th></tr></thead><tbody id="membersBody"></tbody></table>
                        </div>
                    </div>
                    
                    <div id="declarations-tab" style="display: none;">
                        <div class="stats">
                            <div class="stat-card"><div class="stat-number" id="declarationCount">0</div><div>Total Declarations</div></div>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <button class="export-btn" onclick="exportDeclarationsCSV()">📥 Export Declarations to CSV</button>
                            <button class="clear-btn" onclick="clearDeclarations()">🗑️ Clear All Declarations</button>
                        </div>
                        <div style="overflow-x: auto;">
                            <table><thead><tr><th>ID</th><th>Full Name</th><th>TSI ID</th><th>Position</th><th>State</th><th>LGA</th><th>Date</th><th>Signature</th><th>Action</th></tr></thead><tbody id="declarationsBody"></tbody></table>
                        </div>
                    </div>
                </div>
            `;
            loadMembers();
            loadDeclarations();
        }
        
        checkAuth();
    </script>
</body>
</html>
